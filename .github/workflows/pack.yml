name: Build Nuget Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 必须在 macOS 上跑：Aura3D.Avalonia 含 net10.0-ios 目标，Linux runner 装不了 ios workload，
  # 在 ubuntu 上这个流水线连 restore 都过不去（更糟的是会发布出缺 iOS 目标的包）。
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: tree:0
    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Install workloads
      # wasm-tools：Aura3D.Avalonia 含 net10.0-browser 目标，pack 它就要 browser 运行时引用包。
      run: dotnet workload install ios wasm-tools

    # 两个切片包（Aura3D.Angle.iOS / Aura3D.Avalonia.Browser）不在这条列车里：
    # 它们的发布通道是 build-ios-lib.yml / build-browser-lib.yml（手动触发，pack + 校验 + 推 nuget.org）。
    # 主包对它们钉的是精确区间，而这里 restore 就从 nuget.org 取，所以区间必须先是线上已经存在的版本——
    # 先跑本流水线去钉一个还没发布的版本，会在这一步直接红，不会发出消费方 restore 不到的包。
    - name: Test
      run: dotnet test src/Test/Aura3D.Tests/Aura3D.Tests.csproj -c Release

    - name: Pack Aura3D.Core
      run: dotnet pack src/Aura3D.Core -o packages -c Release

    - name: Pack Aura3D.Avalonia
      run: dotnet pack src/Aura3D.Avalonia -o packages -c Release
      
    - name: Pack Aura3D.Pipeline.CelShading
      run: dotnet pack src/Aura3D.Pipeline.CelShading -o packages -c Release

    - name: Pack Aura3D.Pipeline.PBR
      run: dotnet pack src/Aura3D.Pipeline.PBR -o packages -c Release

    - name: Pack Aura3D.Pipeline.PBR.Common
      run: dotnet pack src/Aura3D.Pipeline.PBR.Common -o packages -c Release

    - name: Pack Aura3D.Pipeline.PBRForward
      run: dotnet pack src/Aura3D.Pipeline.PBRForward -o packages -c Release
    
    - name: Pack Aura3D.Model.AssimpLoader
      run: dotnet pack src/Aura3D.Model.AssimpLoader -o packages -c Release

    - name: Pack Aura3D.Model.GltfLoader
      run: dotnet pack src/Aura3D.Model.GltfLoader -o packages -c Release

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages

  publish-to-nuget:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # 必须与 nuget.org 可信发布策略里填的「环境」一致，否则 OIDC 令牌 environment 声明为空、校验失败：
    # Environment mismatch for policy 'aura3d': expected 'production', actual ''。
    environment: production
    # 可信发布：必须显式授予 id-token: write，GitHub 才会为该 job 签发 OIDC 令牌；
    # contents: read 用于覆盖顶层权限声明，保证下载 artifact 等步骤正常。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      # OIDC 令牌换取临时 API Key（有效期仅 1 小时），因此紧跟推送步骤，不做多余动作。
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          # 必须是 nuget.org 的“用户名/Profile name”，不是邮箱；建议存为仓库 secret NUGET_USER。
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
