name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # 发布库的门禁：net8.0 与 net10.0 都要构建并打包成功，核心测试必须通过。
  # 必须在 macOS/Windows 上跑：Aura3D.Avalonia 含 net10.0-ios 目标，而
  # `dotnet workload install ios` 在 Linux runner 上是 "Workload ID ios isn't supported on this platform"，
  # 连 restore 引用图里这个 TFM 都做不了（ubuntu 上曾报 "workloads must be installed"）。
  libraries:
    name: Libraries & tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install workloads
        # wasm-tools：Aura3D.Avalonia 现在含 net10.0-browser 目标，pack 它就要 browser 运行时引用包。
        run: dotnet workload install ios wasm-tools

      # 依赖前置：Aura3D.Avalonia 的 iOS / browser 目标以精确区间 [0.1.0] 分别引用
      # Aura3D.Angle.iOS 与 Aura3D.Avalonia.Browser，而这两个包在 CI 里还没发到 nuget.org。
      # 先按 NuGet.config 声明的路径 pack 出 local-feed，后面任何 restore 才有它们可用——
      # 这一步同时验证了消费方拿到的就是包里的切片与构建属性。
      - name: Build local Aura3D package feed
        run: |
          dotnet pack src/Aura3D.Angle.iOS -c Release -o local-feed
          dotnet pack src/Aura3D.Avalonia.Browser -c Release -o local-feed

      - name: Pack all libraries
        run: |
          set -euo pipefail
          for project in \
            src/Aura3D.Core \
            src/Aura3D.Avalonia \
            src/Aura3D.Angle.iOS \
            src/Aura3D.Avalonia.Browser \
            src/Aura3D.Model.AssimpLoader \
            src/Aura3D.Model.GltfLoader \
            src/Aura3D.Pipeline.CelShading \
            src/Aura3D.Pipeline.PBR \
            src/Aura3D.Pipeline.PBR.Common \
            src/Aura3D.Pipeline.PBRForward
          do
            echo "::group::pack $(basename "$project")"
            if ! out=$(dotnet pack "$project" -c Release -o packages 2>&1); then
              printf '%s\n' "$out"
              printf '::error::pack %s 失败 :: %s\n' "$(basename "$project")" \
                "$(printf '%s' "$out" | grep -iE "error|workload" | tail -15 | tr '\n' '|' | tr -d '\r' | cut -c1-1200)"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Test
        run: dotnet test src/Test/Aura3D.Tests/Aura3D.Tests.csproj -c Release

  # 示例与调试工程门禁（Desktop / Android / Web）。iOS 见下方 ios 作业。
  # 同样要 macOS：Example.Desktop 的引用图里有 Aura3D.Avalonia 的 iOS 目标，restore 需要 ios workload。
  examples:
    name: Examples & RenderDebug (Desktop / Android / Browser)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install workloads
        run: dotnet workload install android wasm-tools emscripten ios

      - name: Build local Aura3D package feed
        run: |
          dotnet pack src/Aura3D.Angle.iOS -c Release -o local-feed
          dotnet pack src/Aura3D.Avalonia.Browser -c Release -o local-feed

      - name: Build Example.Desktop
        run: dotnet build example/Example.Desktop/Example.Desktop.csproj -c Release

      - name: Build Example.Android
        run: dotnet build example/Example.Android/Example.Android.csproj -c Release

      - name: Build Example.Browser
        run: dotnet build example/Example.Browser/Example.Browser.csproj -c Release

      - name: Build RenderDebug.Desktop
        run: dotnet build src/RenderDebug/RenderDebug.Desktop/RenderDebug.Desktop.csproj -c Release

      - name: Build RenderDebug.Android
        run: dotnet build src/RenderDebug/RenderDebug.Android/RenderDebug.Android.csproj -c Release

  # iOS 只能在 macOS runner 上编译（需要 Xcode 与 ios workload）。
  # Example.iOS 钉的是 net10.0-ios27.0（与本机 Xcode 27.0/27A266a 一致），而 macos-latest
  # 默认 Xcode 只有 26.6，.NET for iOS 27 的包会硬校验版本；所以这里用官方 xcode-27 预览标签。
  # 只构建不签名：dotnet build 默认面向模拟器，不会触发 codesign。
  ios:
    name: Examples (iOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workload
        run: dotnet workload install ios

      - name: Build local Aura3D package feed
        run: |
          dotnet pack src/Aura3D.Angle.iOS -c Release -o local-feed
          dotnet pack src/Aura3D.Avalonia.Browser -c Release -o local-feed

      - name: Build Example.iOS
        run: |
          set +e
          out=$(dotnet build example/Example.iOS/Example.iOS.csproj -c Release 2>&1); code=$?
          printf '%s\n' "$out"
          [ "$code" = 0 ] && exit 0
          printf '::error::Example.iOS exit %s :: %s\n' "$code" "$(printf '%s' "$out" | grep -iE "error|warning XDOC|ValidateXcode" | tail -20 | tr '\n' '|' | tr -d '\r' | cut -c1-1500)"
          exit "$code"
