name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # 发布库的门禁：net8.0 与 net10.0 都要构建并打包成功，核心测试必须通过。
  # 必须在 macOS/Windows 上跑：Aura3D.Avalonia 含 net10.0-ios 目标，而
  # `dotnet workload install ios` 在 Linux runner 上是 "Workload ID ios isn't supported on this platform"，
  # 连 restore 引用图里这个 TFM 都做不了（ubuntu 上曾报 "workloads must be installed"）。
  libraries:
    name: Libraries & tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install workloads
        # wasm-tools：Aura3D.Avalonia 现在含 net10.0-browser 目标，pack 它就要 browser 运行时引用包。
        run: dotnet workload install ios wasm-tools

      # 两个切片包（Aura3D.Angle.iOS / Aura3D.Avalonia.Browser）由 nuget.org 提供，
      # 主包按 Directory.Packages.props 里的精确区间解析它们；发布通道见
      # build-ios-lib.yml / build-browser-lib.yml。
      - name: Pack all libraries
        run: |
          set -euo pipefail
          for project in \
            src/Aura3D.Core \
            src/Aura3D.Avalonia \
            src/Aura3D.Angle.iOS \
            src/Aura3D.Avalonia.Browser \
            src/Aura3D.Model.AssimpLoader \
            src/Aura3D.Model.FbxLoader \
            src/Aura3D.Model.GltfLoader \
            src/Aura3D.Pipeline.CelShading \
            src/Aura3D.Pipeline.PBR \
            src/Aura3D.Pipeline.PBR.Common \
            src/Aura3D.Pipeline.PBRForward
          do
            echo "::group::pack $(basename "$project")"
            if ! out=$(dotnet pack "$project" -c Release -o packages 2>&1); then
              printf '%s\n' "$out"
              printf '::error::pack %s 失败 :: %s\n' "$(basename "$project")" \
                "$(printf '%s' "$out" | grep -iE "error|workload" | tail -15 | tr '\n' '|' | tr -d '\r' | cut -c1-1200)"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Test
        run: dotnet test src/Test/Aura3D.Tests/Aura3D.Tests.csproj -c Release

  # 示例与调试工程门禁（Desktop / Android / Web）。iOS 见下方 ios 作业。
  # 同样要 macOS：Aura3D.Gallery.Desktop 的引用图里有 Aura3D.Avalonia 的 iOS 目标，restore 需要 ios workload。
  gallery:
    name: Gallery & RenderDebug (Desktop / Android / Browser)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install workloads
        # emsdk 没有独立的 workload ID：.NET 10 里它是 wasm-tools 的 extends（抽象 workload
        # microsoft-net-sdk-emscripten），`workload install emscripten` 直接报"未识别工作负载 ID"。
        run: dotnet workload install android wasm-tools ios

      - name: Check gallery asset manifest
        # gallery/assets 是入库的压缩产物；这一步核对清单与代码一致：页面的 RequireSet 里没有未登记的 Key、
        # 清单里没有无人取用的 Key。体积只打印不设门禁——资产在程序集之外、按功能页懒加载，
        # 没有任何一次会话会把全部资产下完，合计值不是用户要付的代价。
        # 源资产（gallery/assets-src）不入库，所以这里只读现有产物。
        run: node tools/assets/generate.mjs --check

      - name: Check gallery CJK font coverage
        # 浏览器宿主拿不到系统字体，中文靠内嵌的 Noto Sans SC 子集出字（子集与它的码点清单一并入库）。
        # 这一步不重新生成字体，只核对产物在、且 UI 里出现的非 ASCII 字符确实被子集覆盖。
        # 体积只打印不设门禁——字体大小由字符集范围决定，拍一个 MB 数当闸门只会挡住真要扩字符集的时候。
        run: python3 tools/fonts/generate-cjk-font.py --check

      - name: Build Aura3D.Gallery.Desktop
        run: dotnet build gallery/Aura3D.Gallery.Desktop/Aura3D.Gallery.Desktop.csproj -c Release

      - name: Build Aura3D.Gallery.Android
        run: dotnet build gallery/Aura3D.Gallery.Android/Aura3D.Gallery.Android.csproj -c Release

      - name: Build Aura3D.Gallery.Browser
        run: dotnet build gallery/Aura3D.Gallery.Browser/Aura3D.Gallery.Browser.csproj -c Release

      - name: Build RenderDebug.Desktop
        run: dotnet build src/RenderDebug/RenderDebug.Desktop/RenderDebug.Desktop.csproj -c Release

      - name: Build RenderDebug.Android
        run: dotnet build src/RenderDebug/RenderDebug.Android/RenderDebug.Android.csproj -c Release

  # iOS 只能在 macOS runner 上编译（需要 Xcode 与 ios workload）。
  # Aura3D.Gallery.iOS 钉的是 net10.0-ios27.0（与本机 Xcode 27.0/27A266a 一致），而 macos-latest
  # 默认 Xcode 只有 26.6，.NET for iOS 27 的包会硬校验版本；所以这里用官方 xcode-27 预览标签。
  # 只构建不签名：dotnet build 默认面向模拟器，不会触发 codesign。
  ios:
    name: Gallery (iOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workload
        run: dotnet workload install ios

      - name: Build Aura3D.Gallery.iOS
        run: |
          set +e
          out=$(dotnet build gallery/Aura3D.Gallery.iOS/Aura3D.Gallery.iOS.csproj -c Release 2>&1); code=$?
          printf '%s\n' "$out"
          [ "$code" = 0 ] && exit 0
          printf '::error::Aura3D.Gallery.iOS exit %s :: %s\n' "$code" "$(printf '%s' "$out" | grep -iE "error|warning XDOC|ValidateXcode" | tail -20 | tr '\n' '|' | tr -d '\r' | cut -c1-1500)"
          exit "$code"
