name: Build Library (Aura3D.Angle.MacOS)

# 手动构建并发布 macOS 切片包的通道。与 iOS 包不同，这条流水线在 macos runner 上
# 真正重建 ANGLE 切片（depot_tools + gn + ninja）和 IOSurface 的 C shim，然后打包：
# 仓库里 native/macos-arm64/ 提交的切片只是「最近一次本地构建」的底子，
# 流水线产出的才是本次发布的切片。
# 版本号在触发时输入，用 -p:Version 覆盖工程里写死的那行；publish 输入设 false 时
# 只构建 + pack + 校验、把 nupkg 当 artifact 传回来，不碰 nuget.org。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 本次发布的包版本，形如 0.1.0 / 0.1.1-alpha.1
        type: string
        required: true
      publish:
        description: 校验通过后推送到 nuget.org
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-library-angle-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # 与 iOS 切片同源同版本；升级时同时改 build-angle-macos.sh
  ANGLE_REVISION: 58f8882372e8a4e83da821ac5d16f0323c3fa1af

jobs:
  build-and-pack:
    name: Build ANGLE + Pack Aura3D.Angle.MacOS
    # 必须用 macOS runner：ANGLE 按 target_os=mac 构建，Xcode 提供 clang 与 Metal 工具链
    # （macos-15 镜像的 Xcode 16 内置 Metal，不需要 Xcode 26 的独立工具链下载）。
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check version input
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            printf '::error::version 输入为空\n'
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            printf '::error::version 输入 "%s" 不是三段式版本号；用 0.1.0 或 0.1.1-alpha.1 这种形式\n' "$VERSION"
            exit 1
          fi
          printf '版本号输入通过：%s\n' "$VERSION"

      - name: Install depot_tools
        # gn / ninja / gclient 都在里面；浅克隆即可，depot_tools 自更新在 sync 时自动完成
        run: |
          set -euo pipefail
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Cache ANGLE checkout
        # gclient sync 要拉数 GB 的第三方源码；按 revision 做缓存键，同 revision 的重跑直接命中
        id: angle-cache
        uses: actions/cache@v4
        with:
          path: ~/angle_macos
          key: angle-macos-${{ env.ANGLE_REVISION }}

      - name: Fetch ANGLE at pinned revision
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://chromium.googlesource.com/angle/angle "$HOME/angle_macos"
          cd "$HOME/angle_macos"
          git checkout "$ANGLE_REVISION"
          gclient sync -D

      - name: Build ANGLE (macos-arm64, Metal backend)
        run: |
          set -euo pipefail
          cd "$HOME/angle_macos"
          gn gen out/macos-arm64 --args='target_os = "mac"
            target_cpu = "arm64"
            is_component_build = false
            angle_enable_metal = true
            is_debug = false
            enable_rust = false'
          ninja -C out/macos-arm64 libEGL libGLESv2

      - name: Stage slice + build IOSurface shim
        # shim 源码在本仓库；切片产出自 ANGLE 构建。打包工程 native/ 下的提交件被本次构建覆盖。
        run: |
          set -euo pipefail
          mkdir -p src/Aura3D.Angle.MacOS/native/macos-arm64
          cp "$HOME/angle_macos/out/macos-arm64/libEGL.dylib" \
             "$HOME/angle_macos/out/macos-arm64/libGLESv2.dylib" \
             src/Aura3D.Angle.MacOS/native/macos-arm64/
          cc -shared -o src/Aura3D.Angle.MacOS/native/macos-arm64/libAura3dAngleMacOSHelper.dylib \
             src/Aura3D.Angle.MacOS/shim/aura3d_angle_macos.c \
             -framework CoreFoundation -framework IOSurface
          ls -la src/Aura3D.Angle.MacOS/native/macos-arm64/

      - name: Pack
        run: |
          set -euo pipefail
          if ! out=$(dotnet pack src/Aura3D.Angle.MacOS -c Release -o packages "-p:Version=$VERSION" 2>&1); then
            printf '%s\n' "$out"
            printf '::error::pack Aura3D.Angle.MacOS 失败 :: %s\n' "$(printf '%s' "$out" | grep -iE "error|native|ANGLE" | tail -15 | tr '\n' '|' | tr -d '\r' | cut -c1-1200)"
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Check version took effect
        run: |
          set -euo pipefail
          count=$(find packages -maxdepth 1 -name 'Aura3D.Angle.MacOS.*.nupkg' | wc -l | tr -d '[:space:]')
          if [ "$count" != 1 ]; then
            printf '::error::packages/ 下有 %s 个 Aura3D.Angle.MacOS 包，期望正好 1 个（多了就没法知道推的是哪个）\n' "$count"
            exit 1
          fi
          pkg=$(ls packages/Aura3D.Angle.MacOS.*.nupkg)
          packed=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <(unzip -p "$pkg" Aura3D.Angle.MacOS.nuspec) | head -1)
          declared=$(grep -m1 -oE '<Version>[^<]+</Version>' src/Aura3D.Angle.MacOS/Aura3D.Angle.MacOS.csproj | sed -E 's:</?Version>::g')
          pinned=$(grep -m1 -oE '<Aura3DAngelMacosVersion>[^<]+</Aura3DAngelMacosVersion>' Directory.Packages.props | sed -E 's:</?Aura3DAngelMacosVersion>::g')
          printf '输入版本 %s\n包里版本 %s\n工程里写死的版本 %s\nprops 钉的区间版本 %s\n' "$VERSION" "$packed" "$declared" "$pinned"
          if [ "$packed" != "$VERSION" ]; then
            printf '::error::包里是 %s 而不是输入的 %s——版本号被规范化或 -p:Version 没生效，这种包不能发\n' "$packed" "$VERSION"
            exit 1
          fi
          if printf '%s' "$declared" | grep -q '$('; then
            printf '::error::csproj 的 <Version> 还在引用属性 %s——这个包的版本号必须写死在工程里\n' "$declared"
            exit 1
          fi
          if [ "$declared" != "$pinned" ]; then
            printf '::error::仓库内已经自相矛盾：csproj 写死 %s，而 Directory.Packages.props 钉 %s\n' "$declared" "$pinned"
            printf '::error::把两处改成同一个号再发\n'
            exit 1
          fi
          if [ "$declared" != "$VERSION" ]; then
            printf '::warning::本次发的是 %s，工程里仍写死 %s；发完把 Aura3D.Angle.MacOS.csproj 的 <Version> 补成 %s\n' "$VERSION" "$declared" "$VERSION"
          fi
          if [ "$pinned" != "$VERSION" ]; then
            printf '::warning::本次发的是 %s，而主包区间仍钉 %s；发完把 Directory.Packages.props 的 Aura3DAngelMacosVersion 补成 %s，再跑 pack.yml 重发主包\n' "$VERSION" "$pinned" "$VERSION"
          fi

      - name: Check package contents
        run: |
          set -euo pipefail
          pkg=$(ls packages/Aura3D.Angle.MacOS.*.nupkg)
          listing=$(unzip -Z1 "$pkg")
          status=0
          for required in \
            native/macos-arm64/libEGL.dylib \
            native/macos-arm64/libGLESv2.dylib \
            native/macos-arm64/libAura3dAngleMacOSHelper.dylib \
            build/Aura3D.Angle.MacOS.targets \
            buildTransitive/Aura3D.Angle.MacOS.targets \
            Aura3D.Angle.MacOS.nuspec
          do
            if printf '%s\n' "$listing" | grep -qxF "$required"; then
              printf 'ok   %s\n' "$required"
            else
              printf 'MISS %s\n' "$required"
              printf '::error::%s 里缺少 %s\n' "$pkg" "$required"
              status=1
            fi
          done
          exit "$status"

      - name: Summarize
        run: |
          set -euo pipefail
          pkg=$(ls packages/Aura3D.Angle.MacOS.*.nupkg)
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <(unzip -p "$pkg" Aura3D.Angle.MacOS.nuspec) | head -1)
          {
            echo "## Aura3D.Angle.MacOS"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 包 | \`$(basename "$pkg")\` |"
            echo "| 输入的版本 | $VERSION |"
            echo "| ANGLE revision | $ANGLE_REVISION |"
            echo "| 大小 | $(du -h "$pkg" | cut -f1) |"
            echo "| commit | ${{ github.sha }} |"
            echo "| 本次是否推送 nuget.org | ${{ inputs.publish && '是' || '否（只留 artifact）' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: aura3d-angle-macos-nupkg
          path: packages/*.nupkg
          if-no-files-found: error
          retention-days: 30

  publish-to-nuget:
    if: inputs.publish
    needs: build-and-pack
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aura3d-angle-macos-nupkg
          path: packages

      - name: Refuse a version nuget.org already has
        run: |
          set -euo pipefail
          count=$(find packages -maxdepth 1 -name 'Aura3D.Angle.MacOS.*.nupkg' | wc -l | tr -d '[:space:]')
          if [ "$count" != 1 ]; then
            printf '::error::artifact 里有 %s 个 Aura3D.Angle.MacOS 包，期望正好 1 个\n' "$count"
            exit 1
          fi
          pkg=$(ls packages/Aura3D.Angle.MacOS.*.nupkg)
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <(unzip -p "$pkg" Aura3D.Angle.MacOS.nuspec) | head -1)
          if [ -z "$version" ]; then
            exit 1
          fi
          index=$(curl -sfL "https://api.nuget.org/v3-flatcontainer/aura3d.angle.macos/index.json" || true)
          if printf '%s' "$index" | grep -qF "\"$version\""; then
            printf '::error::Aura3D.Angle.MacOS %s 已经在 nuget.org 上了，换一个版本号\n' "$version"
            exit 1
          fi
          printf 'nuget.org 上没有 Aura3D.Angle.MacOS %s，可以推\n' "$version"

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
